# This workflow will do a clean install of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Build Main

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:

    runs-on: ubuntu-latest

    # Hoisted to job level so step-level `if:` can test it — the `secrets`
    # context is not available in step conditions, but `env` is.
    #
    # SITE pins the pack this job builds/deploys. There is intentionally no
    # `site` matrix and no Marvel job here: Marvel hosting is deferred (a
    # plain GitHub Pages repo would serve from a sub-path and break every
    # absolute reference this app makes — see the plan's WU-16 notes), so
    # sites/marvel/generated/*.json is only ever produced by a local
    # `SITE=marvel` build, never by CI.
    env:
      SITE: starwars
      SYNC_TOKEN: ${{ secrets.SYNC_REPOS_TOKEN }}

    strategy:
      matrix:
        node-version: [20.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run lint
    - run: npm test
    - run: cd build_scripts && node prepJson.js
    - run: npm run build --if-present

    # Must run after the build: it reuses build/index.html so the hashed asset
    # references stay correct. Without these files GitHub Pages answers every
    # /character/<Name> URL with a 404.
    - name: Prerender character pages
      working-directory: build_scripts
      run: node prerenderCharacters.js

    # Replace docs/ wholesale rather than copying over it. `cp -r` never
    # deletes, so every past build's hashed chunks stayed behind forever --
    # docs/ had grown to 131 MB of dead files. Anything the site needs must
    # therefore come out of the build: public/ holds CNAME, .nojekyll and the
    # Yandex verification file so they survive this.
    # `build/.` (not `build/*`) so dotfiles like .nojekyll are copied too.
    - name: Sync build output into docs/
      run: |
        rm -rf ./docs
        mkdir -p ./docs
        cp -r ./build/. ./docs/
        test -f ./docs/CNAME || { echo "::error::docs/CNAME missing - custom domain would break"; exit 1; }
        test -f ./docs/index.html || { echo "::error::docs/index.html missing"; exit 1; }
        test -d ./docs/character || { echo "::error::docs/character missing - prerender did not run"; exit 1; }
        expected=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("./sites/starwars/generated/characters.json","utf8")).length)')
        count=$(find ./docs/character -maxdepth 1 -name '*.html' | wc -l | tr -d ' ')
        [ "$count" = "$expected" ] || { echo "::error::docs/character has $count pages, expected $expected"; exit 1; }
        # Derived at runtime from the pack's own data rather than a hardcoded
        # character name, so CI stays content-agnostic: first title (any
        # character page must carry a canonical link) and the first title
        # containing a non-ASCII character (proves percent-decoded filenames
        # survive the GitHub Pages round-trip).
        FIRST_TITLE=$(node -e '
          const fs = require("fs");
          const characters = JSON.parse(fs.readFileSync("./sites/starwars/generated/characters.json", "utf8"));
          process.stdout.write(characters[0].title.normalize("NFC"));
        ')
        NONASCII_TITLE=$(node -e '
          const fs = require("fs");
          const characters = JSON.parse(fs.readFileSync("./sites/starwars/generated/characters.json", "utf8"));
          const found = characters.find(c => /[^\x00-\x7F]/.test(c.title));
          if (!found) { console.error("no non-ASCII character title found in sites/starwars/generated/characters.json"); process.exit(1); }
          process.stdout.write(found.title.normalize("NFC"));
        ')
        test -f "./docs/character/${FIRST_TITLE}.html" || { echo "::error::first character page missing: ${FIRST_TITLE}"; exit 1; }
        grep -q 'rel="canonical"' "./docs/character/${FIRST_TITLE}.html" || { echo "::error::prerendered page missing canonical"; exit 1; }
        test -f "./docs/character/${NONASCII_TITLE}.html" || { echo "::error::non-ASCII character page missing: ${NONASCII_TITLE}"; exit 1; }

    - uses: EndBug/add-and-commit@v7.3.0
      with:
        add: '.'
        message: 'github action build'

    # Sync generated Jekyll character pages to DavidLozzi/starwars-guide.
    # Must run after add-and-commit above, which stages '.' and would otherwise
    # pick up the starwars-guide checkout as a gitlink.
    #
    # Requires repo secret SYNC_REPOS_TOKEN: fine-grained PAT with
    #   - DavidLozzi/starwars-guide: Contents Read and write
    # Without that secret these steps are skipped and the build still passes.
    - name: Checkout starwars-guide
      if: github.event_name == 'push' && env.SYNC_TOKEN != ''
      uses: actions/checkout@v4
      with:
        repository: DavidLozzi/starwars-guide
        ref: main
        token: ${{ secrets.SYNC_REPOS_TOKEN }}
        path: starwars-guide
        fetch-depth: 0
        persist-credentials: false

    - name: Verify cross-repo token access
      if: github.event_name == 'push' && env.SYNC_TOKEN != ''
      run: |
        set -e
        perm=$(curl -s \
          -H "Authorization: Bearer ${SYNC_TOKEN}" \
          -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/DavidLozzi/starwars-guide" \
          | jq -r '.permissions.push // false')
        if [ "$perm" != "true" ]; then
          echo "::error::SYNC_REPOS_TOKEN lacks push access to DavidLozzi/starwars-guide. Add this repo with Contents: Read and write."
          exit 1
        fi
        echo "OK: push access to starwars-guide"

    # website.js writes to ../../starwars-guide relative to build_scripts/,
    # i.e. the parent of the workspace; link the checkout there.
    - name: Link starwars-guide for website.js
      if: github.event_name == 'push' && env.SYNC_TOKEN != ''
      run: |
        ln -sfn "$GITHUB_WORKSPACE/starwars-guide" "$GITHUB_WORKSPACE/../starwars-guide"
        mkdir -p "$GITHUB_WORKSPACE/starwars-guide/character" "$GITHUB_WORKSPACE/starwars-guide/assets/characters"

    - name: Generate character pages (website.js)
      if: github.event_name == 'push' && env.SYNC_TOKEN != ''
      working-directory: build_scripts
      run: node website.js

    - name: Commit and push starwars-guide
      if: github.event_name == 'push' && env.SYNC_TOKEN != ''
      run: |
        set -e
        git config --global --unset-all http.https://github.com/.extraheader || true
        cd "$GITHUB_WORKSPACE/starwars-guide"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add character assets/characters
        if git diff --cached --quiet; then
          echo "No starwars-guide changes"
        else
          git commit -m "chore: sync character pages from starwars-timeline (${{ github.repository }}@${{ github.sha }})"
          git -c credential.helper= push "https://x-access-token:${SYNC_TOKEN}@github.com/DavidLozzi/starwars-guide.git" HEAD:main
        fi

