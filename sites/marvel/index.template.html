<!DOCTYPE html>
<!-- The `booting` class scopes the critical boot CSS below so it can never leak
     into the mounted app; src/index.jsx removes it once React has rendered. -->
<html lang="en" class="booting">

<head>
  <!-- Start Single Page Apps for GitHub Pages -->
  <script type="text/javascript">
    // Single Page Apps for GitHub Pages
    // MIT License
    // https://github.com/rafgraph/spa-github-pages
    // This script checks to see if a redirect is present in the query string,
    // converts it back into the correct url and adds it to the
    // browser's history using window.history.replaceState(...),
    // which won't cause the browser to attempt to load the new url.
    // When the single page app is loaded further down in this file,
    // the correct url will be waiting in the browser's history for
    // the single page app to route accordingly.
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&')
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location))
  </script>
  <!-- End Single Page Apps for GitHub Pages -->

  <!-- Marvel pack ships with no analytics IDs configured (sites/marvel/site.config.mjs
       analytics: {}) -- the GTM/Clarity/AdSense/GA4 snippets the Star Wars pack
       carries here are intentionally omitted rather than emitted empty. -->

  <meta charset="utf-8" />
  <link rel="icon" href="/favicon.ico" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#121212" />
  <link rel="apple-touch-icon" href="/Logo192.png" />
  <meta http-equiv='cache-control' content='no-cache'>
  <meta http-equiv='expires' content='0'>
  <meta http-equiv='pragma' content='no-cache'>

  <!-- build_scripts/prerenderCharacters.js replaces this exact line per character page. -->
  <link rel="canonical" href="https://timeline.marvel.guide/" />

  <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
  <link rel="manifest" href="/manifest.json" />
  <!--
      Paths above are absolute (/favicon.ico, /manifest.json, ...). Files served
      this way live in public/, which Vite copies to the build root as-is.
    -->

  <!--
      Critical boot CSS. styled-components injects everything else, but that only
      happens once the JS bundle has parsed and React has mounted -- until then the
      pre-rendered #root SEO markup rendered as black-on-white default HTML.

      #boot-loader is the classic opening title card. It is a SIBLING of #root and
      is emitted BEFORE it in the body, so the browser paints it on the very first
      frame -- ahead of the pre-rendered SEO markup that streams in after it.

      Being outside #root also means ReactDOM.render does NOT wipe it: the app
      mounts and paints underneath, and src/index.jsx calls window.__dismissBoot()
      to fade the card away. If the bundle never loads, the card gives up on its own
      after 10s (pure CSS, no JS) so the pre-rendered content stays reachable.
    -->
  <style>
    /* Everything here is scoped to html.booting. React renders INTO #root, so an
       unscoped `#root a` (or a `color` on body) would keep styling the live app
       after mount. */
    .booting body {
      background-color: rgb(18, 18, 18);
      color: rgb(205, 205, 205);
      margin: 0;
      font-family: 'Segoe UI', Roboto, sans-serif;
    }

    .booting #root h1,
    .booting #root h2,
    .booting #root h3,
    .booting #root h4,
    .booting #root a {
      color: rgb(212, 175, 55);
    }

    #boot-loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 8vw;
      background-color: #000;
      animation: boot-give-up 1s ease-in 10s forwards;
    }

    #boot-loader p {
      margin: 0;
      max-width: 30rem;
      font-family: 'Arial Black', Arial, sans-serif;
      font-size: clamp(1.25rem, 5.5vw, 2.75rem);
      line-height: 1.35;
      letter-spacing: .01em;
      color: #b21820;
      /* Kept short relative to the hold: the fade-in eats the front of it, so a
         long one makes the card feel like it appeared for much less time than
         HOLD_MS actually is. */
      animation: boot-fade-in .8s ease-out both;
    }

    /* Set by window.__dismissBoot(); wins over the give-up animation. */
    #boot-loader.boot-done {
      animation: none;
      opacity: 0;
      transition: opacity 700ms ease-in;
      pointer-events: none;
    }

    @keyframes boot-fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes boot-give-up {
      to {
        opacity: 0;
        visibility: hidden;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      #boot-loader p,
      #boot-loader.boot-done {
        animation: none;
        transition: none;
      }
    }
  </style>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>

  <!-- Must stay ABOVE #root so it is parsed and painted before the pre-rendered
       SEO markup; see the boot CSS comment in <head>. -->
  <div id="boot-loader">
    <p>Avengers Assemble.</p>
  </div>
  <script>
    (function () {
      var el = document.getElementById('boot-loader');
      // The home page holds the title card for a beat before revealing the
      // timeline. Deep links (/character/<Name>, mostly arrivals from search)
      // skip the hold and drop straight into the app.
      var isHome = !/^\/character\//.test(window.location.pathname);
      var HOLD_MS = isHome ? 1500 : 0;
      var shownAt = Date.now();

      window.__dismissBoot = function () {
        window.__dismissBoot = function () { };
        setTimeout(function () {
          el.className = 'boot-done';
          setTimeout(function () { el.remove(); }, 800);
        }, Math.max(0, HOLD_MS - (Date.now() - shownAt)));
      };
    }());
  </script>

  <div id="root">
    <!-- PRERENDER:BODY:START -->
    <!-- PRERENDER:BODY:END -->
  </div>
  <!--
      This HTML file is the app entry point and the build template.

      The #root markup above is pre-rendered SEO content, regenerated by
      build_scripts/prepJson.js; React replaces it on mount.

      To begin development, run `SITE=marvel npm start`.
      To create a production bundle, run `SITE=marvel npm run build`.
    -->
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
